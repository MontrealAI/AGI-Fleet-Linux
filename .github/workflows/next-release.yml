name: Linux 1.1.5 release qualification
on:
  pull_request:
  push:
    branches: [main]
    paths: ['engineering/next-release.json']
  workflow_call:
    inputs:
      validation_only:
        description: Run every existing gate without publishing a Dedicated Fleet release
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this explicitly prepared release after qualification
        type: boolean
        required: true
        default: false

permissions:
  contents: read
concurrency:
  group: next-linux-release-${{ github.ref }}${{ github.event_name == 'pull_request' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - &checkout
        name: Fetch the exact workflow commit
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Verify repository and engineering regressions
        run: |
          python3 engineering/check-repository.py --require-source
          python3 engineering/check-successor-preservation.py
          python3 -m unittest discover -s engineering/tests -v
      - &node_runtime
        name: Install hash-pinned Node for package validation
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz -o "$RUNNER_TEMP/node.tar.xz"
          printf '%s  %s\n' fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6 "$RUNNER_TEMP/node.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.21.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Build and validate the deterministic saved archive
        run: python3 engineering/build-next-release.py --output "$RUNNER_TEMP/candidate-dist"
      - name: Retain exact candidate and packaging evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-next-candidate
          path: ${{ runner.temp }}/candidate-dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  successor:
    name: Saved-archive SUCCESSOR browser execution
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Download this run's saved candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: linux-next-candidate
          path: release
      - *node_runtime
      - name: Install locked browser driver
        run: |
          npm ci --prefix engineering/browser-tests --ignore-scripts --no-audit --no-fund
          engineering/browser-tests/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Verify archive and materialize its real Fleet source
        run: |
          python3 - <<'PYCODE'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'engineering')
          from next_release_tools import load_candidate, verify_candidate, candidate_tools
          archive=Path('release/AGI_Fleet_Linux_v1.1.5.zip')
          candidate=load_candidate('release/release.json',archive)
          verify_candidate(archive,candidate)
          candidate_tools(candidate).extract(archive,Path('saved-fleet'))
          PYCODE
      - name: Execute actual browser effects through the saved Controller and ComputeWorker
        env:
          FLEET_TEST_ROOT: ${{ github.workspace }}/saved-fleet/AGI_Fleet_Linux_v1.1.5
          FLEET_TEST_METADATA: ${{ github.workspace }}/release/release.json
        run: npm test --prefix engineering/browser-tests
      - name: Retain exact browser observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: next-successor-browser
          path: engineering/browser-tests/test-results/
          if-no-files-found: error
          retention-days: 90
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - *checkout
      - &download_candidate
        name: Download this run's saved candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: linux-next-candidate
          path: release
      - name: Exercise targeted cases and complete native suite
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_SHA python3 engineering/run-next-native.py \
            --metadata "$GITHUB_WORKSPACE/release/release.json" \
            --archive "$GITHUB_WORKSPACE/release/AGI_Fleet_Linux_v1.1.5.zip" \
            --work "/root/agi-next-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --evidence "$GITHUB_WORKSPACE/native-evidence"
      - name: Preserve evidence ownership
        if: always()
        run: |
          if test -d native-evidence; then sudo chown -R "$(id -u):$(id -g)" native-evidence; fi
      - name: Retain every native test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: next-native-${{ matrix.arch }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 90
  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - *checkout
      - *download_candidate
      - name: Requalify the saved Fleet with AGIJobManager
        run: |
          python3 engineering/run-next-integration.py \
            --metadata "$GITHUB_WORKSPACE/release/release.json" \
            --archive "$GITHUB_WORKSPACE/release/AGI_Fleet_Linux_v1.1.5.zip" \
            --work "$RUNNER_TEMP/agi-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --evidence "$GITHUB_WORKSPACE/integration-evidence"
      - name: Retain all integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: next-integration-${{ matrix.arch }}
          path: integration-evidence/
          if-no-files-found: error
          retention-days: 90
  profile-integration:
    name: Saved-archive ${{ matrix.profile }} contract profile
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64, profile: manager-1.17.0-b7218196}
          - {runner: ubuntu-24.04-arm, arch: arm64, profile: manager-1.17.0-b7218196}
          - {runner: ubuntu-24.04, arch: x64, profile: manager-1.19.3-d0c2cbaf}
          - {runner: ubuntu-24.04-arm, arch: arm64, profile: manager-1.19.3-d0c2cbaf}
    runs-on: ${{ matrix.runner }}
    env:
      CONTRACT_PROFILE: ${{ matrix.profile }}
    timeout-minutes: 45
    steps:
      - *checkout
      - *download_candidate
      - name: Prepare hash-pinned Node and exact Manager source
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'engineering')
          from contract_profiles import CONTRACT_PROFILES, baseline
          root = Path(os.environ['RUNNER_TEMP']) / 'profile-tools'
          root.mkdir()
          node, arch = baseline.install_node(root)
          profile = CONTRACT_PROFILES[os.environ['CONTRACT_PROFILE']]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PROFILE_NODE={node}/node\nPROFILE_NPM={node}/npm\nPROFILE_MANAGER_COMMIT={profile["commit"]}\n')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(node) + '\n')
          PYCODE
          mkdir "$RUNNER_TEMP/profile-manager"
          git -C "$RUNNER_TEMP/profile-manager" init
          git -C "$RUNNER_TEMP/profile-manager" remote add origin https://github.com/MontrealAI/AGIJobManager.git
      - name: Build the locked Manager profile dependencies
        run: |
          set -euo pipefail
          manager="$RUNNER_TEMP/profile-manager"
          git -C "$manager" fetch --depth=1 origin "$PROFILE_MANAGER_COMMIT"
          git -C "$manager" checkout --detach FETCH_HEAD
          test "$(git -C "$manager" rev-parse HEAD)" = "$PROFILE_MANAGER_COMMIT"
          cd "$manager"
          "$PROFILE_NPM" ci --ignore-scripts --no-audit --no-fund
          "$PROFILE_NPM" --prefix hardhat ci --ignore-scripts --no-audit --no-fund
          "$PROFILE_NODE" scripts/security/patch-openzeppelin-compiler.cjs
          "$PROFILE_NPM" run build
      - name: Exercise the complete saved archive with the selected profile
        run: |
          python3 engineering/run-next-profile-integration.py \
            --metadata "$GITHUB_WORKSPACE/release/release.json" \
            --archive "$GITHUB_WORKSPACE/release/AGI_Fleet_Linux_v1.1.5.zip" \
            --work "$RUNNER_TEMP/profile-saved-work" \
            --evidence "$RUNNER_TEMP/profile-evidence" \
            --manager "$RUNNER_TEMP/profile-manager" --node "$PROFILE_NODE" \
            --contract-profile "$CONTRACT_PROFILE"
      - name: Retain complete archive and profile observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: next-profile-${{ matrix.profile }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/profile-evidence/
          if-no-files-found: error
          retention-days: 90
  audit:
    needs: [build, native, integration, profile-integration, successor]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *download_candidate
      - name: Download all retained validation logs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: next-*
          path: evidence
      - name: Independently audit source-bound results
        run: |
          python3 engineering/audit-next-evidence.py \
            --metadata release/release.json --archive release/AGI_Fleet_Linux_v1.1.5.zip \
            --native evidence/next-native-x64 --native evidence/next-native-arm64 \
            --integration evidence/next-integration-x64 --integration evidence/next-integration-arm64 \
            --profile evidence/next-profile-manager-1.17.0-b7218196-x64 --profile evidence/next-profile-manager-1.17.0-b7218196-arm64 \
            --profile evidence/next-profile-manager-1.19.3-d0c2cbaf-x64 --profile evidence/next-profile-manager-1.19.3-d0c2cbaf-arm64 \
            --successor evidence/next-successor-browser --out evidence/audit.json
          python3 engineering/publish-next-release.py --prepare-only --release-dir release --evidence-dir evidence --output publication
      - name: Retain audited publication files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: next-publication
          path: publication/
          if-no-files-found: error
          retention-days: 90
  qualification-gate:
    name: Required release qualification
    if: always()
    needs: [build, native, integration, profile-integration, successor, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - *checkout
      - name: Reject missing, failed, cancelled or skipped qualification children
        env:
          CHILD_RESULTS: ${{ toJSON(needs) }}
        run: python3 engineering/governance/check_children.py --needs "$CHILD_RESULTS"
  publish:
    if: ${{ !inputs.validation_only && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    needs: [build, native, integration, profile-integration, successor, audit, qualification-gate]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *download_candidate
      - name: Download independently audited publication files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: next-publication
          path: publication
      - name: Publish the exact validated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 engineering/publish-next-release.py --release-dir release --output publication
