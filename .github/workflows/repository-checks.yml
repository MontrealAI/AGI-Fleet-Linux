name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch this exact commit
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Validate workflow grammar with hash-pinned actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint/tool.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint/tool.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/tool.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=
      - name: Check evidence metadata, handoff links and source identity
        run: python3 engineering/check-repository.py
      - name: Exercise extraction safety and integrity failures
        run: python3 -m unittest discover -s engineering/tests -v
      - name: Check Mac build and website metadata against repository changes
        run: python3 -m unittest discover -s macos/tests -v
      - name: Exercise mainnet observer materialization failures
        run: node --test engineering/tests/*.test.mjs
      - name: Replay retained manager 1.14.0 compatibility evidence
        run: python3 validation/audit-manager-1.14.0.py
      - name: Replay retained manager 1.15.0 compatibility evidence
        run: python3 validation/audit-manager-1.15.0.py
      - name: Parse engineering scripts
        run: |
          python3 -m compileall -q engineering
          node --check engineering/verify-mainnet-deployment.mjs
          node --check engineering/verify-mainnet-source.mjs
