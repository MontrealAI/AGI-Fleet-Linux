name: Diagnose native suite failures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-suite.yml, engineering/diagnose-suite.py]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact diagnostic harness
        env:
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/engineering
        run: |
          set -eu
          for script in run-frozen-native.py diagnose-suite.py; do
            curl --fail --location --silent --show-error "$BASE_URL/$script" --output "$RUNNER_TEMP/$script"
          done
      - name: Reproduce using a clearly marked diagnostic copy
        run: |
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_SHA python3 "$RUNNER_TEMP/diagnose-suite.py" \
            --work "/root/agi-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --evidence "$GITHUB_WORKSPACE/diagnostic-evidence"
      - name: Retain diagnostic evidence
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/diagnostic-evidence"
      - name: Upload diagnostic evidence (not acceptance)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: suite-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          retention-days: 90
          if-no-files-found: error
