name: Final public-package native Computer Use consumer
on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string
      runner:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: final-public-package-computer-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.architecture }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native-computer:
    name: Final public package service and two disposable payment routes (${{ inputs.architecture }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a
        with:
          egress-policy: audit
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Download unchanged authenticated public assets from this caller run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: final-public-input-assets
          path: public-assets
      - name: Reauthenticate public bytes and materialize source packages without checkout filling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S -B engineering/integration/public_release_install.py sources --bundle "$PWD/public-assets" --work "$RUNNER_TEMP/public-package-installation"
      - name: Expose exact released companion pins
        id: pins
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path('public-assets/input.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for role in ('alpha','jobs','manager'):
                  output.write(role+'='+value['repositories'][role]['released']['commit']+'\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Protect the official hosted caches before project Python executes
        run: |
          mkdir -p reports/saved-package/computer-evidence
          /usr/bin/python3 -I -S -B engineering/integration/prepare-hosted-runtime.py --prepare-only > reports/saved-package/computer-evidence/early-toolcache-permission-preparation.json
      - name: Install the existing native Alpha session dependencies
        run: |
          python -B engineering/integration/source_guard.py --alpha-root "$PWD/.integration-alpha" --dependency-lock engineering/integration/requirements-native.lock
          python -m pip install --require-hashes --only-binary=:all: -r engineering/integration/requirements-native.lock
      - name: Install the actual released Alpha wheel's declared locked dependencies
        run: |
          /usr/bin/python3 -I -S -B engineering/integration/prepare-hosted-runtime.py --prepare-only > reports/saved-package/computer-evidence/pre-full-alpha-dependencies-toolcache-preparation.json
          python -m pip install --require-hashes --only-binary=:all: -r .integration-alpha/requirements-agent.lock
      - name: Protect newly installed locked dependencies before the wheel installer
        run: |
          /usr/bin/python3 -I -S -B engineering/integration/prepare-hosted-runtime.py --prepare-only > reports/saved-package/computer-evidence/pre-wheel-toolcache-preparation.json
      - name: Install and verify the actual published Alpha wheel without importing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I -S -B engineering/integration/public_release_install.py wheel --bundle "$PWD/public-assets" --work "$RUNNER_TEMP/public-package-installation"
      - name: Normally install the unchanged published alpha7 package and pinned Node
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          test "$ARCH" = "$(node -p process.arch)"
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux apparmor-profiles
          /usr/bin/python3 -I -S -B engineering/integration/public_release_install.py installation --bundle "$PWD/public-assets" --work "$RUNNER_TEMP/public-package-installation" --architecture "$ARCH"
          mkdir -p reports/saved-package/computer-evidence
          cp "$RUNNER_TEMP/public-package-installation/package-observation.json" reports/saved-package/computer-evidence/package-observation.json
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY python3 local-runtime/prepare-engineering-host.py > reports/saved-package/computer-evidence/apparmor.json
      - name: Prepare only the exact probed hosted runtime files
        run: |
          /usr/bin/python3 -I -S -B engineering/integration/prepare-hosted-runtime.py "$FLEET_PUBLIC_APPLICATION" "$PWD/.integration-alpha" > reports/saved-package/computer-evidence/toolcache-permission-preparation.json
      - name: Derive the existing strict Jobs source transition from actual released Git objects
        run: |
          "$FLEET_PUBLIC_NODE" engineering/integration/public-release-source-transition.cjs "$PWD/public-assets/input.json" "$PWD/.integration-jobs" "$PWD/public-assets/jobs/source-profile-rc16.json" "$PWD/reports/saved-package/computer-evidence/jobs-source-transition.json"
      - name: Bind real producer context and observe the separately installed wheel CLI
        env:
          ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          "$FLEET_PUBLIC_NODE" engineering/integration/execution-context.mjs "$ARCH" "$FLEET_PUBLIC_ARCHIVE" > reports/saved-package/computer-evidence/execution-context.json
          test ! -e "$RUNNER_TEMP/public-wheel-cli-state"
          cd "$RUNNER_TEMP"
          python -I -B -m alpha_factory_v1.core.runtime.cli --home "$RUNNER_TEMP/public-wheel-cli-state" successor-transform demo --output "$GITHUB_WORKSPACE/reports/saved-package/computer-evidence/wheel-cli-demo.json"
      - name: Require source orchestration and native inspector regressions
        run: |
          FQR_VERIFY_ALPHA="$PWD/.integration-alpha" FQR_VERIFY_JOBS="$PWD/.integration-jobs" FQR_VERIFY_MANAGER="$PWD/.integration-manager" "$FLEET_PUBLIC_NODE" --test engineering/integration/*.test.mjs
          python -B -m unittest discover -s engineering/integration -p 'test_*.py' -v
      - name: Build the existing Alpha worker with observed immutable runtime provenance
        id: image
        run: |
          set -euo pipefail
          mkdir -p reports/saved-package/computer-evidence
          BASE_TAG=mcr.microsoft.com/playwright/python:v1.63.0-noble
          docker pull "$BASE_TAG"
          docker image inspect "$BASE_TAG" > reports/saved-package/computer-evidence/base-image-inspect.json
          BASE_DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE_TAG")
          docker build --build-arg "BASE_IMAGE=$BASE_DIGEST" -f .integration-alpha/examples/successor-workbench/computer/Dockerfile -t successor-four-repository-worker .integration-alpha
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' successor-four-repository-worker)
          docker image inspect successor-four-repository-worker > reports/saved-package/computer-evidence/worker-image-inspect.json
          printf 'id=%s\n' "$IMAGE_ID" >> "$GITHUB_OUTPUT"
          sha256sum .integration-alpha/examples/successor-workbench/computer/Dockerfile .integration-alpha/examples/successor-workbench/computer/requirements.lock .integration-alpha/alpha_factory_v1/core/runtime/successor/computer_worker.py > reports/saved-package/computer-evidence/runtime-source-SHA256SUMS.txt
      - name: Prepare public synthetic starter inputs without executing a browser
        run: |
          python -B engineering/integration/run-computer.py --alpha-root "$PWD/.integration-alpha" --jobs-root "$PWD/.integration-jobs" --output "$PWD/reports/saved-package/computer-evidence/accepted" --prepare-only
          python -B engineering/integration/run-computer.py --alpha-root "$PWD/.integration-alpha" --jobs-root "$PWD/.integration-jobs" --output "$PWD/reports/saved-package/computer-evidence/rejected-late" --prepare-only --inject-error late
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Build the exact Jobs public interface and canonical local-chain contracts
        run: |
          set -euo pipefail
          npm install --global npm@10.8.2 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = 10.8.2
          npm --prefix .integration-jobs ci --ignore-scripts --no-audit --no-fund
          cd .integration-jobs
          (
            cd demo/CULTURE-v0
            corepack enable
            CYPRESS_INSTALL_BINARY=0 corepack pnpm install --frozen-lockfile
          )
          node --test test/scripts/four-repo-computer-lifecycle.test.cjs
          node scripts/pages/build.mjs
          npx hardhat compile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Build the exact Manager public interface and canonical local-chain contracts
        run: |
          set -euo pipefail
          npm --prefix .integration-manager ci --ignore-scripts --no-audit --no-fund
          npm --prefix .integration-manager/hardhat ci --ignore-scripts --no-audit --no-fund
          cd .integration-manager
          node --test hardhat/test/four-repo-computer-lifecycle.test.cjs
          node scripts/site/build.mjs
          node scripts/security/patch-openzeppelin-compiler.cjs
          npm --prefix hardhat run compile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Drive the actual Jobs forward controls and consume the downloaded native handoff
        env:
          WORKER_IMAGE: ${{ steps.image.outputs.id }}
          ARCH: ${{ inputs.architecture }}
          ARCHIVE_NAME: agi-fleet-local-0.1.0-alpha.7.zip
        run: |
          set -euo pipefail
          EVIDENCE="$PWD/reports/saved-package/computer-evidence"
          EXPECTED=$("$FLEET_PUBLIC_NODE" engineering/integration/execution-context.mjs "$ARCH" "$FLEET_PUBLIC_ARCHIVE")
          "$FLEET_PUBLIC_NODE" engineering/integration/verify-gui.mjs "$EVIDENCE" "$PWD/.integration-alpha" "$PWD/.integration-jobs" "$PWD/.integration-manager" --expected-context "$EXPECTED" --record-builds --alpha-site "$PWD/.integration-alpha/docs" --jobs-site "$PWD/.integration-jobs/build/pages" --manager-site "$PWD/.integration-manager/build/pages"
          "$FLEET_PUBLIC_NODE" engineering/integration/run-gui.mjs forward "$EVIDENCE" "$PWD/.integration-alpha" "$PWD/.integration-jobs" "$PWD/.integration-manager" "$WORKER_IMAGE"
          "$FLEET_PUBLIC_NODE" engineering/integration/verify-gui.mjs "$EVIDENCE" "$PWD/.integration-alpha" "$PWD/.integration-jobs" "$PWD/.integration-manager" --expected-context "$EXPECTED" --accept-forward
      - name: Execute GUI-produced handoff bytes through the actual saved LocalRuntime service and dashboard
        env:
          WORKER_IMAGE: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          PYTHON_PHYSICAL=$(python -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve())')
          "$FLEET_PUBLIC_NODE" engineering/integration/service-journey.mjs "$FLEET_PUBLIC_APPLICATION" "$PWD/.integration-alpha" "$PYTHON_PHYSICAL" "$WORKER_IMAGE" "$PWD/reports/saved-package/computer-evidence"
          "$FLEET_PUBLIC_NODE" engineering/integration/finalize-computer.mjs "$PWD/.integration-alpha" "$PWD/.integration-jobs" "$PWD/.integration-manager" "$PWD/reports/saved-package/computer-evidence/accepted"
          "$FLEET_PUBLIC_NODE" engineering/integration/finalize-computer.mjs "$PWD/.integration-alpha" "$PWD/.integration-jobs" "$PWD/.integration-manager" "$PWD/reports/saved-package/computer-evidence/rejected-late" rejected
      - name: Reopen the full native history in Alpha and produce both financial archives through real GUI controls
        env:
          WORKER_IMAGE: ${{ steps.image.outputs.id }}
          ARCH: ${{ inputs.architecture }}
          ARCHIVE_NAME: agi-fleet-local-0.1.0-alpha.7.zip
        run: |
          set -euo pipefail
          EVIDENCE="$PWD/reports/saved-package/computer-evidence"
          "$FLEET_PUBLIC_NODE" engineering/integration/run-gui.mjs complete "$EVIDENCE" "$PWD/.integration-alpha" "$PWD/.integration-jobs" "$PWD/.integration-manager" "$WORKER_IMAGE"
          "$FLEET_PUBLIC_NODE" engineering/integration/verify-gui.mjs "$EVIDENCE" "$PWD/.integration-alpha" "$PWD/.integration-jobs" "$PWD/.integration-manager" --expected-context "$("$FLEET_PUBLIC_NODE" engineering/integration/execution-context.mjs "$ARCH" "$FLEET_PUBLIC_ARCHIVE")"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Exercise the actual GUI-produced AGIALPHA draft on a fresh disposable chain
        env:
          FQR_ALPHA_COMMIT: ${{ steps.pins.outputs.alpha }}
        run: |
          cd .integration-jobs
          FQR_DRAFT_FILE="$GITHUB_WORKSPACE/reports/saved-package/computer-evidence/gui/jobs-en/proposal.json" \
          FQR_ALPHA_SOURCE="$GITHUB_WORKSPACE/.integration-alpha" \
          FQR_INPUT_CLASS=ACTUAL_NATIVE_DOCKER_BROWSER_SCRIPTED_ADVICE \
          FQR_EVIDENCE_FILE="$GITHUB_WORKSPACE/reports/saved-package/computer-evidence/jobs-local-lifecycle.json" \
          npx hardhat run --no-compile --network hardhat integrations/alpha-agent/four-repo-computer-lifecycle.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Exercise the actual GUI-produced USDC draft on a separate fresh disposable chain
        env:
          FQR_ALPHA_COMMIT: ${{ steps.pins.outputs.alpha }}
          FQR_JOBS_COMMIT: ${{ steps.pins.outputs.jobs }}
        run: |
          cd .integration-manager
          FQR_DRAFT_FILE="$GITHUB_WORKSPACE/reports/saved-package/computer-evidence/gui/manager-en/proposal.json" \
          FQR_ALPHA_SOURCE="$GITHUB_WORKSPACE/.integration-alpha" \
          FQR_JOBS_SOURCE="$GITHUB_WORKSPACE/.integration-jobs" \
          FQR_EVIDENCE_FILE="$GITHUB_WORKSPACE/reports/saved-package/computer-evidence/manager-local-lifecycle.json" \
          node hardhat/scripts/four-repo-computer-lifecycle.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Reconcile the actual service return and both chain observations
        env:
          ARCH: ${{ inputs.architecture }}
          ARCHIVE_NAME: agi-fleet-local-0.1.0-alpha.7.zip
        run: |
          "$FLEET_PUBLIC_NODE" engineering/integration/verify-evidence.mjs "$PWD/reports/saved-package/computer-evidence" "$PWD/.integration-alpha" "$PWD/.integration-jobs" "$PWD/.integration-manager" --expected-context "$("$FLEET_PUBLIC_NODE" engineering/integration/execution-context.mjs "$ARCH" "$FLEET_PUBLIC_ARCHIVE")"
          python -B engineering/integration/service-package.py verify --archive "$FLEET_PUBLIC_ARCHIVE" --application "$FLEET_PUBLIC_APPLICATION" --commit "$GITHUB_SHA" --observation "$PWD/reports/saved-package/computer-evidence/package-observation.json"
          "$FLEET_PUBLIC_NODE" engineering/integration/finish-service.mjs "$PWD/reports/saved-package/computer-evidence" "$PWD/reports/saved-package/local-host-evidence/computer-journey.json"
      - name: Assert no source changes or native container survives
        run: |
          test -z "$(git -C .integration-alpha status --porcelain --untracked-files=no)"
          test -z "$(git -C .integration-jobs status --porcelain --untracked-files=no)"
          test -z "$(git -C .integration-manager status --porcelain --untracked-files=no)"
          test -z "$(docker container ls --all --quiet --filter name=successor-computer-)"
      - name: Verify unchanged public package bytes and retain a separate package proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S -B engineering/integration/public_release_install.py finish --bundle "$PWD/public-assets" --work "$RUNNER_TEMP/public-package-installation" --evidence "$PWD/reports/saved-package/computer-evidence"
      - name: Retain public observations and exclude private generated journals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-public-package-journey-${{ inputs.architecture }}
          if-no-files-found: error
          retention-days: 90
          path: |
            reports/saved-package/public-package-evidence/public-package-proof.json
            reports/saved-package/local-host-evidence/computer-journey.json
            reports/saved-package/computer-evidence/*.json
            reports/saved-package/computer-evidence/*.txt
            reports/saved-package/computer-evidence/*.zip
            reports/saved-package/computer-evidence/forward/*.json
            reports/saved-package/computer-evidence/forward/*.png
            reports/saved-package/computer-evidence/gui/**/*.json
            reports/saved-package/computer-evidence/gui/**/*.png
            reports/saved-package/computer-evidence/gui/**/*.html
            reports/saved-package/computer-evidence/accepted/dashboard/**/*.json
            reports/saved-package/computer-evidence/accepted/dashboard/**/*.png
            reports/saved-package/computer-evidence/accepted/*.json
            reports/saved-package/computer-evidence/accepted/native/*.json
            reports/saved-package/computer-evidence/accepted/native/*.png
            reports/saved-package/computer-evidence/accepted/native/visible-text.txt
            reports/saved-package/computer-evidence/rejected-late/*.json
            reports/saved-package/computer-evidence/rejected-late/native/*.json
            reports/saved-package/computer-evidence/rejected-late/native/*.png
            reports/saved-package/computer-evidence/rejected-late/native/visible-text.txt
            reports/saved-package/computer-evidence/interrupted/*.json
            reports/saved-package/computer-evidence/interrupted/native/*.json
            reports/saved-package/computer-evidence/interrupted/native/*.png
            reports/saved-package/computer-evidence/interrupted/native/visible-text.txt
            reports/saved-package/computer-evidence/recovered/*.json
            reports/saved-package/computer-evidence/recovered/native/*.json
            reports/saved-package/computer-evidence/recovered/native/*.png
            reports/saved-package/computer-evidence/recovered/native/visible-text.txt
