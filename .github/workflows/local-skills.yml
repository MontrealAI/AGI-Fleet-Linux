name: Local Skills development qualification
on:
  pull_request:
    paths: ['fleet/**', 'local-runtime/**', 'local-dashboard/**', 'role-skills/**', 'docs/local-skills/**', 'LOCAL_SKILLS.md', '.github/workflows/local-skills.yml']
  push:
    branches: [main]
    paths: ['local-runtime/preview-release.json']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the explicitly prepared Local Skills development preview
        type: boolean
        required: true
        default: false
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: local-skills-${{ github.ref }}${{ github.event_name == 'pull_request' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Fetch exact source
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Preserve existing source inventory and engineering acceptance
        run: |
          python3 engineering/check-repository.py --require-source
          python3 engineering/check-successor-preservation.py
          python3 -m unittest discover -s engineering/tests -q
      - name: Install the existing hash-pinned Node runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, hashlib, urllib.request, tarfile
          from pathlib import Path
          pins=json.loads(Path('fleet/shared/runtime/compute/runtime-artifacts.lock.json').read_text())
          target=next(x for x in pins['node']['archives'] if x['platform']=='linux-'+os.environ['ARCH'])
          archive=Path(os.environ['RUNNER_TEMP'])/'local-node.tar.xz'
          urllib.request.urlretrieve(target['url'],archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==target['sha256']
          with tarfile.open(archive) as t: t.extractall(os.environ['RUNNER_TEMP'],filter='data')
          with open(os.environ['GITHUB_PATH'],'a') as f: f.write(str(Path(os.environ['RUNNER_TEMP'])/('node-v24.21.0-linux-'+os.environ['ARCH'])/'bin')+'\n')
          PY
      - name: Install declared sandbox and locked JavaScript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux apparmor-profiles
          npm ci --prefix fleet --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Load distribution sandbox policy on the disposable engineering VM
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-host-evidence"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY \
            python3 local-runtime/prepare-engineering-host.py | tee "$RUNNER_TEMP/local-host-evidence/apparmor.json"
      - name: Check skills and state/transport regressions
        run: |
          set -euo pipefail
          node local-runtime/validate.mjs
          node --test --test-reporter=tap local-runtime/tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/local-host-evidence/source.tap"
          AGI_LOCAL_NODE_ARCHIVE="$RUNNER_TEMP/local-node.tar.xz" \
            python3 -m unittest discover -s local-runtime/tests -p test_install.py -v 2>&1 | tee "$RUNNER_TEMP/local-host-evidence/installer.log"
          python3 -m unittest discover -s local-runtime/tests -p test_release.py -v
      - name: Build and verify a development archive, never an operator installer
        run: |
          python3 local-runtime/package.py --output "$RUNNER_TEMP/local-preview"
          python3 local-runtime/package.py --verify "$RUNNER_TEMP/local-preview/agi-fleet-local-0.1.0-alpha.5.zip"
      - name: Exercise exact extracted bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path
          target=Path(os.environ['RUNNER_TEMP'])/'local-extracted'
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'local-preview/agi-fleet-local-0.1.0-alpha.5.zip') as z:
            z.extractall(target)
            for i in z.infolist(): (target/i.filename).chmod(stat.S_IMODE(i.external_attr>>16))
          PY
          cd "$RUNNER_TEMP/local-extracted/agi-fleet-local-0.1.0-alpha.5"
          node local-runtime/validate.mjs
          node --test --test-reporter=tap local-runtime/tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/local-host-evidence/extracted.tap"
      - name: Require real native isolation and actual worker artifacts
        run: |
          set -euo pipefail
          node --test --test-reporter=tap local-runtime/tests/native/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/local-host-evidence/native-source.tap"
      - name: Require native isolation from the exact saved archive
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test --test-reporter=tap "$RUNNER_TEMP"/local-extracted/agi-fleet-local-0.1.0-alpha.5/local-runtime/tests/native/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/local-host-evidence/native-archive.tap"
      - name: Install the saved package and run the actual local service and worker
        run: |
          AGI_LOCAL_PACKAGE_ARCHIVE="$RUNNER_TEMP/local-preview/agi-fleet-local-0.1.0-alpha.5.zip" \
          AGI_LOCAL_NODE_ARCHIVE="$RUNNER_TEMP/local-node.tar.xz" \
          AGI_LOCAL_INSTALL_EVIDENCE="$RUNNER_TEMP/local-host-evidence/installed-journey.json" \
            node local-runtime/qualification/installed-journey.mjs
      - name: Prepare the existing locked OpenClaw client for assistant qualification
        run: |
          mkdir "$RUNNER_TEMP/local-openclaw"
          cp fleet/shared/runtime/compute/runtime-package/package*.json "$RUNNER_TEMP/local-openclaw/"
          npm ci --prefix "$RUNNER_TEMP/local-openclaw" --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Require the pinned assistant to invoke the real saved runtime and sandbox
        run: |
          for role in agent node moderator employer evidence recovery; do
            OPENCLAW_BIN="$RUNNER_TEMP/local-openclaw/node_modules/openclaw/openclaw.mjs" \
            AGI_LOCAL_OPENCLAW_EVIDENCE="$RUNNER_TEMP/local-host-evidence/openclaw-$role.json" \
              node "$RUNNER_TEMP/local-extracted/agi-fleet-local-0.1.0-alpha.5/local-runtime/qualification/openclaw-journey.mjs" "--role=$role"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for role in ['agent', 'node', 'moderator', 'employer', 'evidence', 'recovery']:
            e=json.loads((Path(os.environ['RUNNER_TEMP'])/('local-host-evidence/openclaw-'+role+'.json')).read_text())
            assert e['role']==role and e['actualGateway'] is True and e['actualSandbox'] is True and e['skillObserved'] is True
            assert e['evidenceClass']=='NATIVE_LOCAL_RUNTIME' and e['providerTransport']=='local-synthetic-fixture'
          PY
      - name: Bind successful observations to exact source and package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          archive=base/'local-preview/agi-fleet-local-0.1.0-alpha.5.zip'
          (base/'local-host-evidence/qualification.json').write_text(json.dumps({
              'commit':os.environ['GITHUB_SHA'],'workflowRun':os.environ['GITHUB_RUN_ID'],
              'architecture':os.environ['ARCH'],'archiveSHA256':hashlib.sha256(archive.read_bytes()).hexdigest()})+'\n')
          PYCODE
      - name: Retain development artifact identity
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: local-skills-preview-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/local-preview/
            ${{ runner.temp }}/local-host-evidence/
          if-no-files-found: warn
          retention-days: 30
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact source
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Use pinned Node and browser distributions
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz -o "$RUNNER_TEMP/node.tar.xz"
          printf '%s  %s\n' fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6 "$RUNNER_TEMP/node.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.21.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install locked browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux
          npm ci --prefix fleet --ignore-scripts --omit=dev --no-audit --no-fund
          npm ci --prefix engineering/browser-tests --ignore-scripts --no-audit --no-fund
          engineering/browser-tests/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Exercise English and French controls, reflow and accessibility
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-dashboard-evidence"
          node --test --test-reporter=tap local-runtime/tests/browser/dashboard.test.mjs 2>&1 | tee "$RUNNER_TEMP/local-dashboard-evidence/browser.tap"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP'])/'local-dashboard-evidence/qualification.json').write_text(json.dumps({
              'commit':os.environ['GITHUB_SHA'],'workflowRun':os.environ['GITHUB_RUN_ID'],
              'evidenceClass':'BROWSER_WITH_DECLARED_SYNTHETIC_WORKER'})+'\n')
          PYCODE
      - name: Retain non-secret dashboard observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: local-dashboard-observations
          path: ${{ runner.temp }}/local-dashboard-evidence/
          if-no-files-found: warn
          retention-days: 30
  audit:
    needs: [native, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download this run's Local Skills observations
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: local-*
          path: evidence
      - name: Independently audit both saved packages and all observations
        run: python3 local-runtime/release.py --evidence evidence --output "$RUNNER_TEMP/local-audited"
      - name: Retain the audited preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: audited-local-preview
          path: ${{ runner.temp }}/local-audited/
          if-no-files-found: error
          retention-days: 90
  fleet:
    if: github.ref == 'refs/heads/main'
    # The reusable workflow declares a write-scoped publisher, disabled below.
    # Its build/test/audit jobs retain their own read-only permissions.
    permissions:
      contents: write
    uses: ./.github/workflows/next-release.yml
    with:
      validation_only: true
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [native, browser, audit, fleet]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download this run's exact Local Skills packages and observations
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: local-*
          path: evidence
      - name: Download this run's audited full Fleet regression evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: next-publication
          path: fleet-evidence
      - name: Reaudit and publish the immutable labeled preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 local-runtime/release.py --evidence evidence --fleet fleet-evidence --output "$RUNNER_TEMP/local-publication" --publish
