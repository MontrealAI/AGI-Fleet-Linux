name: Website / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - fleet/successor/**
      - successor/**
      - website/**
      - engineering/build-website.py
      - engineering/check-website.py
      - engineering/browser-tests/**
      - engineering/current-release.json
      - engineering/published-release.json
      - validation/**
      - docs/**
      - macos/docs/**
      - macos/release.json
      - macos/published-release.json
      - README.md
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - fleet/successor/**
      - successor/**
      - website/**
      - engineering/build-website.py
      - engineering/check-website.py
      - engineering/browser-tests/**
      - engineering/current-release.json
      - engineering/published-release.json
      - validation/**
      - docs/**
      - macos/docs/**
      - macos/release.json
      - macos/published-release.json
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      public_hashes: ${{ steps.content_hashes.outputs.public_hashes }}
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from reviewed release metadata
        run: python3 engineering/build-website.py
      - name: Check public files, links and JavaScript
        run: |
          python3 engineering/check-website.py
          node --check website/app.js
          node --check website/onboarding.js
          node --check website/mac-setup.js
      - name: Install locked website browser tests
        run: npm ci --prefix engineering/browser-tests --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for website checks
        run: engineering/browser-tests/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Exercise mobile layouts, accessibility and guided journeys
        run: npm test --prefix engineering/browser-tests
      - name: Retain website browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: website-browser-evidence
          path: engineering/browser-tests/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Record the checked public content identities
        id: content_hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          hashes = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                    for path in sorted(Path('_site').iterdir()) if path.name != '.nojekyll'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('public_hashes=' + json.dumps(hashes, separators=(',', ':')), file=output)
          PY
      - name: Upload only the checked public site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the exact content served by the public website
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_PUBLIC_HASHES: ${{ needs.build.outputs.public_hashes }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, signal, time, urllib.error, urllib.parse, urllib.request

          page = urllib.parse.urlsplit(os.environ['PAGE_URL'])
          if (page.scheme != 'https' or page.netloc != 'montrealai.github.io'
                  or page.path.rstrip('/') != '/AGI-Fleet-Linux' or page.query or page.fragment):
              raise SystemExit('Unexpected GitHub Pages deployment URL')
          commit = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Invalid deployment commit')
          pending = json.loads(os.environ['EXPECTED_PUBLIC_HASHES'])
          required = {'index.html', 'fr.html', 'start.html', 'start-fr.html', 'styles.css',
                      'successor.html', 'successor-fr.html', 'build-info.json', 'app.js', 'onboarding.css', 'onboarding.js', 'favicon.svg', 'release.json',
                      'mac.html', 'mac-fr.html', 'mac-release.json', 'install-mac.html',
                      'install-mac-fr.html', 'mac-setup.css', 'mac-setup.js'}
          if (not isinstance(pending, dict) or not required <= pending.keys()
                  or not all(re.fullmatch(r'[A-Za-z0-9_.-]+', name)
                             and isinstance(digest, str) and re.fullmatch(r'[0-9a-f]{64}', digest)
                             for name, digest in pending.items())):
              raise SystemExit('Missing or invalid checked content identities')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, new_url):
                  return None

          def deadline_expired(signum, frame):
              raise SystemExit('Public content verification exceeded its 120-second deadline')

          opener = urllib.request.build_opener(NoRedirect)
          deadline = time.monotonic() + 120
          signal.signal(signal.SIGALRM, deadline_expired)
          signal.setitimer(signal.ITIMER_REAL, 120)
          try:
              while pending and time.monotonic() < deadline:
                  for name, digest in list(pending.items()):
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          break
                      url = urllib.parse.urlunsplit(('https', 'montrealai.github.io',
                          '/AGI-Fleet-Linux/' + name, urllib.parse.urlencode({'deployment': commit}), ''))
                      request = urllib.request.Request(url, headers={
                          'Cache-Control': 'no-cache', 'Accept-Encoding': 'identity',
                          'User-Agent': 'AGI-Fleet-Linux-Pages-Verification'})
                      try:
                          with opener.open(request, timeout=min(15, remaining)) as response:
                              if response.status != 200:
                                  raise ValueError('Unexpected HTTP status')
                              content = response.read(5_000_000)
                          if len(content) == 5_000_000:
                              raise ValueError('Response reached the 5 MB read limit')
                          observed = hashlib.sha256(content).hexdigest()
                          if observed != digest:
                              raise ValueError('Served SHA-256 differs: ' + observed)
                          print(f'Verified public {name}: sha256:{observed}', flush=True)
                          del pending[name]
                      except (OSError, ValueError, urllib.error.URLError) as error:
                          print(f'Retrying public {name}: {error}', flush=True)
                  if pending:
                      time.sleep(min(5, max(0, deadline - time.monotonic())))
          finally:
              signal.setitimer(signal.ITIMER_REAL, 0)
          if pending:
              raise SystemExit('Public content verification failed: ' + ', '.join(sorted(pending)))
          PY
