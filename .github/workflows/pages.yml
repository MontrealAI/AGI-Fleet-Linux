name: Website / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - engineering/build-website.py
      - engineering/check-website.py
      - engineering/current-release.json
      - engineering/published-release.json
      - validation/**
      - docs/**
      - README.md
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - engineering/build-website.py
      - engineering/check-website.py
      - engineering/current-release.json
      - engineering/published-release.json
      - validation/**
      - docs/**
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from reviewed release metadata
        run: python3 engineering/build-website.py
      - name: Check public files, links and JavaScript
        run: |
          python3 engineering/check-website.py
          node --check website/app.js
      - name: Upload only the checked public site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
