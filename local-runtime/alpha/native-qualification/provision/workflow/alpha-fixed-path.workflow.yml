# INACTIVE PROPOSAL: not under .github/workflows. Publication/dispatch need approval.
name: Alpha one-time fixed-path fixture qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha-fixed-path-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  fixed-path:
    if: github.repository == 'MontrealAI/AGI-Fleet-Linux' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      FLEET_MATRIX_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the externally approved exact workflow commit without credentials
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os,pathlib,re,subprocess
          e=os.environ
          def need(v):
              if not v: raise RuntimeError('Workflow bootstrap guard refused')
          need(os.geteuid()!=0 and e.get('GITHUB_ACTIONS')=='true' and e.get('RUNNER_ENVIRONMENT')=='github-hosted')
          need(e.get('GITHUB_REPOSITORY')=='MontrealAI/AGI-Fleet-Linux' and e.get('GITHUB_EVENT_NAME')=='workflow_dispatch' and e.get('GITHUB_RUN_ATTEMPT')=='1')
          sha=e.get('GITHUB_SHA','');need(re.fullmatch('[a-f0-9]{40}',sha) and sha==e.get('GITHUB_WORKFLOW_SHA'))
          need(e.get('GITHUB_WORKFLOW_REF')=='MontrealAI/AGI-Fleet-Linux/.github/workflows/alpha-fixed-path.yml@'+e.get('GITHUB_REF',''))
          workspace=pathlib.Path(e['GITHUB_WORKSPACE']);temp=pathlib.Path(e['RUNNER_TEMP'])
          for p in (workspace,temp):
              need(p.is_absolute() and p==p.resolve(strict=True) and p.is_dir())
              need(p.stat().st_uid==os.getuid() and not p.stat().st_mode&0o022)
          need(not workspace.is_relative_to(temp) and not temp.is_relative_to(workspace) and not any(workspace.iterdir()))
          env={k:e[k] for k in ('PATH','HOME','LANG') if k in e};env['GIT_TERMINAL_PROMPT']='0'
          def run(*a):subprocess.run(a,cwd=workspace,env=env,check=True)
          run('git','init','.')
          run('git','remote','add','origin','https://github.com/MontrealAI/AGI-Fleet-Linux.git')
          run('git','fetch','--depth=1','origin',sha)
          run('git','checkout','--detach','FETCH_HEAD')
          actual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=workspace,env=env,text=True).strip();need(actual==sha)
          PY
      - name: Require source-only workflow guard regressions
        run: python3 -B -m unittest discover -s local-runtime/alpha/native-qualification/provision/workflow -p 'test_*.py' -v
      - name: Verify frozen harness tree and derive absent runner paths
        run: python3 -B local-runtime/alpha/native-qualification/provision/workflow/driver.py initialize
      - name: Verify exact PR 47 and fetch only frozen native inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B local-runtime/alpha/native-qualification/provision/workflow/driver.py inputs
      - name: Install enumerated distribution prerequisites and load bounded packaged policy
        run: python3 -B local-runtime/alpha/native-qualification/provision/workflow/driver.py prerequisites
      - name: Prepare isolated fixture authority as the non-root runner
        run: python3 -B local-runtime/alpha/native-qualification/provision/workflow/driver.py prepare
      - name: Execute the exact manifest-bound root provisioning command
        run: python3 -B local-runtime/alpha/native-qualification/provision/workflow/driver.py provision
      - name: Exercise unchanged fixed-path runtime as the non-root runner
        run: python3 -B local-runtime/alpha/native-qualification/provision/workflow/driver.py qualify
      - name: Collect only allowlisted public evidence including failures
        id: collect
        if: always()
        run: python3 -B local-runtime/alpha/native-qualification/provision/workflow/driver.py collect
      - name: Retain public evidence before whole hosted-runner disposal
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: alpha-fixed-path-fixture-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet-alpha-fixed-${{ matrix.target }}/retained/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
